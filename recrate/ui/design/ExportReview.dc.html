<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recrate — Review export</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn:hover{background:#292929}
.ghost:hover{background:#262626}
.trow:hover{background:#26262699}
.chip:hover{background:#17171799}
button:focus-visible,input:focus-visible{outline:2px solid #737373;outline-offset:1px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="xr-title" style="width: 960px; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; border: 1px solid #262626; border-radius: 8px; box-shadow: 0px 12px 24px -4px rgba(0,0,0,0.18); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden;">

<!-- Header -->
<div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 24px; border-bottom: 1px solid #262626;">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<h2 id="xr-title" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;">Review export to KINGSTON</h2>
<div style="font-size: 13px; color: #a3a3a3;">{{formatsLabel}} · 4 playlists</div>
</div>
<button type="button" class="ghost" onClick="{{close}}" aria-label="Close" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 6px; color: #fafafa;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<!-- Body -->
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 24px;">

<!-- Summary filters -->
<div role="group" aria-label="Show changes" style="height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 72px repeat(4, minmax(0, 1fr)); gap: 8px;">
<button type="button" class="chip" aria-pressed="{{chips.all.on}}" onClick="{{chips.all.pick}}" style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 0 12px; background: {{chips.all.bg}}; box-shadow: {{chips.all.ring}}; border: 1px solid #262626; border-radius: 6px; font-family: inherit; color: #fafafa; text-align: left;">
<span style="font-size: 14px; font-weight: 500;">All</span>
<span style="font-size: 12px; color: #a3a3a3; font-variant-numeric: tabular-nums;">{{chips.all.meta}}</span>
</button>
<button type="button" class="chip" aria-pressed="{{chips.copy.on}}" onClick="{{chips.copy.pick}}" style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 0 12px; background: {{chips.copy.bg}}; box-shadow: {{chips.copy.ring}}; border: 1px solid #262626; border-radius: 6px; font-family: inherit; color: #fafafa; text-align: left;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V3"></path><path d="m6 11 6 6 6-6"></path><path d="M19 21H5"></path></svg>Copy</span>
<span style="font-size: 12px; color: #a3a3a3; font-variant-numeric: tabular-nums;">{{chips.copy.meta}}</span>
</button>
<button type="button" class="chip" aria-pressed="{{chips.update.on}}" onClick="{{chips.update.pick}}" style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 0 12px; background: {{chips.update.bg}}; box-shadow: {{chips.update.ring}}; border: 1px solid #262626; border-radius: 6px; font-family: inherit; color: #fafafa; text-align: left;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>Update</span>
<span style="font-size: 12px; color: #a3a3a3; font-variant-numeric: tabular-nums;">{{chips.update.meta}}</span>
</button>
<button type="button" class="chip" aria-pressed="{{chips.skip.on}}" onClick="{{chips.skip.pick}}" style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 0 12px; background: {{chips.skip.bg}}; box-shadow: {{chips.skip.ring}}; border: 1px solid #262626; border-radius: 6px; font-family: inherit; color: #fafafa; text-align: left;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;"><span style="display: flex; color: #facc15;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m4.9 4.9 14.2 14.2"></path></svg></span>Missing</span>
<span style="font-size: 12px; color: #a3a3a3; font-variant-numeric: tabular-nums;">{{chips.skip.meta}}</span>
</button>
<button type="button" class="chip" aria-pressed="{{chips.remove.on}}" onClick="{{chips.remove.pick}}" style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 0 12px; background: {{chips.remove.bg}}; box-shadow: {{chips.remove.ring}}; border: 1px solid #262626; border-radius: 6px; font-family: inherit; color: #fafafa; text-align: left;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;"><span style="display: flex; color: #f87171;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></span>Remove</span>
<span style="font-size: 12px; color: #a3a3a3; font-variant-numeric: tabular-nums;">{{chips.remove.meta}}</span>
</button>
</div>

<!-- Track table -->
<div role="table" aria-label="{{tableLabel}}" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; border: 1px solid #262626; border-radius: 6px; overflow: hidden;">
<div role="row" style="height: 28px; flex-shrink: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr) 168px 64px 248px; column-gap: 12px; align-items: center; padding: 0 12px; background: #17171766; border-bottom: 1px solid #262626; font-size: 12px; font-weight: 500; color: #a3a3a3;">
<span role="columnheader">Action</span><span role="columnheader">Title — artist</span><span role="columnheader">Playlist</span><span role="columnheader" style="text-align: right;">Size</span><span role="columnheader">Note</span>
</div>
<div role="rowgroup" style="flex-grow: 1; min-height: 0; overflow-y: auto;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div role="row" class="trow" style="height: 32px; display: grid; grid-template-columns: 96px minmax(0, 1fr) 168px 64px 248px; column-gap: 12px; align-items: center; padding: 0 12px; border-bottom: 1px solid #262626b3; font-size: 14px;">
<span role="cell" style="display: flex; align-items: center; gap: 6px; font-size: 13px;">
<sc-if value="{{r.isCopy}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V3"></path><path d="m6 11 6 6 6-6"></path><path d="M19 21H5"></path></svg></sc-if>
<sc-if value="{{r.isUpdate}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></sc-if>
<sc-if value="{{r.isSkip}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m4.9 4.9 14.2 14.2"></path></svg></sc-if>
<sc-if value="{{r.isRemove}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></sc-if>
<sc-if value="{{r.isKeep}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<span style="color: {{r.wordColor}};">{{r.word}}</span>
</span>
<span role="cell" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: {{r.titleColor}};">{{r.title}} <span style="color: #a3a3a3;">{{r.artistText}}</span></span>
<span role="cell" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; color: #a3a3a3;">{{r.playlist}}</span>
<span role="cell" style="text-align: right; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; color: #a3a3a3;">{{r.size}}</span>
<span role="cell" style="display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: {{r.noteColor}};">
<span style="flex-grow: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{r.note}}</span>
<sc-if value="{{r.locatable}}" hint-placeholder-val="{{false}}"><button type="button" class="btn" onClick="{{r.locate}}" style="height: 24px; flex-shrink: 0; padding: 0 8px; background: #262626; color: #fafafa; border: 0; border-radius: 6px; font-family: inherit; font-size: 12px;">Locate…</button></sc-if>
</span>
</div>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="height: 96px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #a3a3a3;">{{emptyText}}</div>
</sc-if>
</div>
</div>

<!-- Decisions -->
<div aria-label="Before you export" role="group" style="flex-shrink: 0; max-height: 276px; overflow-y: auto; display: flex; flex-direction: column; border: 1px solid #262626; border-radius: 6px; font-size: 13px;">
<sc-for list="{{decisions}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #262626;">
<span style="display: flex; padding-top: 1px; color: {{d.color}};">
<sc-if value="{{d.danger}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></sc-if>
<sc-if value="{{d.warn}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
<sc-if value="{{d.resolved}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg></sc-if>
</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
<span id="{{d.textId}}" style="line-height: 18px;"><span style="font-weight: 500;">{{d.title}}</span> <span style="color: #a3a3a3;">{{d.body}}</span></span>
<sc-if value="{{d.hasCheck}}" hint-placeholder-val="{{true}}">
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
<input type="checkbox" checked="{{d.checked}}" onChange="{{d.toggle}}" aria-describedby="{{d.textId}}" style="accent-color: #fafafa; width: 16px; height: 16px; margin: 0;">
{{d.label}}</label>
</sc-if>
</div>
<sc-if value="{{d.hasCues}}" hint-placeholder-val="{{false}}">
<a href="CueEditor.dc.html" class="ghost" style="height: 28px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px; border-radius: 6px; font-size: 13px; color: #fafafa;">Choose cues…</a>
</sc-if>
<sc-if value="{{d.hasShow}}" hint-placeholder-val="{{true}}">
<button type="button" class="ghost" aria-pressed="{{d.showOn}}" onClick="{{d.show}}" style="height: 28px; flex-shrink: 0; padding: 0 8px; background: transparent; color: #fafafa; border: 0; border-radius: 6px; font-family: inherit; font-size: 13px;">{{d.showLabel}}</button>
</sc-if>
</div>
</sc-for>
<div style="min-height: 36px; display: flex; align-items: center; gap: 12px; padding: 6px 12px;">
<span style="display: flex; color: {{spaceColor}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg></span>
<span style="flex-grow: 1;">{{spaceText}} <span style="color: #a3a3a3;">{{spaceMeta}}</span></span>
</div>
</div>
</div>

<!-- Footer -->
<div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-top: 1px solid #262626; font-size: 14px;">
<button type="button" class="btn" onClick="{{back}}" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; background: #262626; color: #fafafa; border: 0; border-radius: 6px; font-family: inherit; font-size: 14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Back</button>
<div style="flex-grow: 1;"></div>
<span id="xr-hint" role="status" style="font-size: 13px; color: #a3a3a3;">{{hint}}</span>
<button type="button" onClick="{{exportNow}}" disabled="{{exportDisabled}}" aria-describedby="xr-hint" style="height: 32px; padding: 0 16px; background: {{exportBg}}; color: {{exportFg}}; border: 0; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 500;">Export</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plan":{"editor":null},"draft":{"editor":null},"onBack":{"editor":null},"onExport":{"editor":null},"onClose":{"editor":null},"$preview":{"width":960,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var W = 'Warehouse — Oct 2026', U = 'Warm-up';
    this.base = [
      { id: 'c1', a: 'copy', t: 'Night Ferry', ar: 'Oona Brandt', p: W, mb: 168, note: 'New in playlist' },
      { id: 'c2', a: 'copy', t: 'Parallel Rooms', ar: 'Sable & Finch', p: W, mb: 152, note: 'New in playlist' },
      { id: 'c3', a: 'copy', t: 'Glass Corridor', ar: 'Oona Brandt', p: W, mb: 180, note: '12 memory cues — your 10 are exported', many: true },
      { id: 'c4', a: 'copy', t: 'Salt Flats', ar: 'Ama Idowu', p: U, mb: 142, note: '' },
      { id: 'c5', a: 'copy', t: 'Harbour Lights', ar: 'Sable & Finch', p: U, mb: 156, note: '' },
      { id: 'c6', a: 'copy', t: 'Kiln', ar: 'Sable & Finch', p: U, mb: 138, note: '', flac: true },
      { id: 'c7', a: 'copy', t: 'Slow Orbit', ar: 'Juno Vale', p: U, mb: 161, note: '' },
      { id: 'c8', a: 'copy', t: 'Paper Lanterns', ar: 'Ama Idowu', p: U, mb: 149, note: '' },
      { id: 'c9', a: 'copy', t: 'Tidewater', ar: 'Marlow Ashe', p: U, mb: 158, note: '' },
      { id: 'c10', a: 'copy', t: 'Soft Machinery', ar: 'Halden Rue', p: U, mb: 144, note: '' },
      { id: 'c11', a: 'copy', t: 'Copper Sky', ar: 'Juno Vale', p: U, mb: 152, note: '' },
      { id: 'c12', a: 'copy', t: 'Driftwood Hymn', ar: 'Oona Brandt', p: U, mb: 147, note: '' },
      { id: 'c13', a: 'copy', t: 'Low Sun', ar: 'Keel & Marsh', p: U, mb: 139, note: '' },
      { id: 'c14', a: 'copy', t: 'Quiet Engines', ar: 'Halden Rue', p: U, mb: 155, note: '' },
      { id: 'c15', a: 'copy', t: 'Pale Blue Hour', ar: 'Marlow Ashe', p: U, mb: 160, note: '' },
      { id: 'c16', a: 'copy', t: 'Velvet Static', ar: 'Juno Vale', p: U, mb: 147, note: '' },
      { id: 'c17', a: 'copy', t: 'First Light Transit', ar: 'Keel & Marsh', p: U, mb: 152, note: '' },
      { id: 'u1', a: 'update', t: 'Low Tide Signal', ar: 'Marlow Ashe', p: W, note: '4 cue edits' },
      { id: 'u2', a: 'update', t: 'Lantern Code', ar: 'Ama Idowu', p: W, note: 'Beat grid moved' },
      { id: 'u3', a: 'update', t: 'Concrete Choir', ar: 'Halden Rue', p: W, note: '14 memory cues — choose 10 to export', many: true },
      { id: 'u4', a: 'update', t: 'Signal Fires', ar: 'Keel & Marsh', p: W, note: '2 cue edits' },
      { id: 'u5', a: 'update', t: 'Northbound', ar: 'Juno Vale', p: W, note: 'Loop added' },
      { id: 'u6', a: 'update', t: 'Hollow Grid', ar: 'Halden Rue', p: W, note: '1 cue edit · beat grid moved' },
      { id: 'u7', a: 'update', t: 'Amber Room', ar: 'Oona Brandt', p: W, note: '11 memory cues — your 10 are exported', many: true },
      { id: 'u8', a: 'update', t: 'Undertow', ar: 'Marlow Ashe', p: W, note: '3 cue edits' },
      { id: 'u9', a: 'update', t: 'Chalk Lines', ar: 'Ama Idowu', p: W, note: 'Hot cue colors' },
      { id: 's1', a: 'skip', t: 'Brass Weather', ar: 'Keel & Marsh', p: W, mb: 171, note: 'File not found · last seen on MUSIC-SSD' },
      { id: 's2', a: 'skip', t: 'Sodium Lights', ar: 'Juno Vale', p: W, mb: 149, note: 'File not found · moved or deleted' }
    ];
    var plan = this.plan();
    // Decisions survive Back and Choose cues. Approvals of deletions only survive for the same plan.
    var d = props.draft || {};
    var same = d.key === plan.key;
    this.state = {
      filter: 'all', started: false,
      relinked: d.relinked || (plan.missingResolved ? ['s1', 's2'] : []),
      missingAck: !!d.missingAck, cueAck: !!d.cueAck,
      removeOk: same && !!d.removeOk, replaceOk: same && !!d.replaceOk, mediaOk: same && !!d.mediaOk
    };
  }
  plan() {
    return this.props.plan || {
      key: 'minimal|keep||legacy+plus', formatsLabel: 'Device Library and Device Library Plus', convertFor: '', missingResolved: false,
      removals: [{ key: 'minimal', name: 'Minimal', tracks: 88, freed: 9.4, rows: [
        { t: 'Frost Pattern', ar: 'Halden Rue', mb: 162, keepIn: null }, { t: 'Lantern Code', ar: 'Ama Idowu', mb: 150, keepIn: 'Warehouse — Oct 2026' },
        { t: 'Mercury Steps', ar: 'Oona Brandt', mb: 148, keepIn: null }, { t: 'Morning Tram', ar: 'Keel & Marsh', mb: 150, keepIn: 'Sunday rooftop' },
        { t: 'Thin Air', ar: 'Juno Vale', mb: 155, keepIn: null }] }],
      delTracks: 61, freedGB: 9.4, replace: false, media: false
    };
  }
  gb(mb) { return (mb / 1000).toFixed(1) + ' GB'; }
  renderVals() {
    var self = this, st = this.state, plan = this.plan();
    var conv = plan.convertFor || '';
    var linked = function (r) { return st.relinked.indexOf(r.id) >= 0; };
    // Rows for this plan: copies, updates, missing files, then the exact removal and replacement set.
    var all = this.base.map(function (r) {
      if (r.a === 'skip' && linked(r)) return Object.assign({}, r, { a: 'copy', note: 'Relinked in review' });
      return r;
    });
    plan.removals.forEach(function (rm) {
      rm.rows.forEach(function (x, i) {
        all.push(x.keepIn
          ? { id: rm.key + i, a: 'keep', t: x.t, ar: x.ar, p: rm.name, note: 'Also in ' + x.keepIn + ' — stays on drive' }
          : { id: rm.key + i, a: 'remove', t: x.t, ar: x.ar, p: rm.name, mb: x.mb, note: x.alsoRemoved ? 'Also in ' + x.alsoRemoved + ', also removed — deleted' : 'Only in this playlist — deleted' });
      });
      all.push({ id: rm.key + 'more', a: 'more', t: (rm.tracks - rm.rows.length) + ' more tracks in ' + rm.name, p: rm.name, note: '' });
    });
    if (plan.replace) {
      all.push({ id: 'rb', a: 'replace', t: 'rekordbox’s library', ar: '3 playlists · 137 track entries · 137 analysis files', p: 'rekordbox 6', note: 'Removed from the drive’s library · backed up first' });
      if (plan.media) {
        [['Aurora Steps', 'Kenji Moreau', 164], ['Blue Hour Drive', 'Nadia Okoro', 158], ['Canal Lights', 'Teo Lindqvist', 171]].forEach(function (m, i) {
          all.push({ id: 'rbm' + i, a: 'media', t: m[0], ar: m[1], p: 'rekordbox 6', mb: m[2], note: 'Copied to this computer, then deleted' });
        });
        all.push({ id: 'rbmore', a: 'more', t: '134 more rekordbox audio files', p: 'rekordbox 6', note: '' });
      } else {
        all.push({ id: 'rbkeep', a: 'keep', t: 'rekordbox’s 137 audio files', ar: '21.8 GB', p: 'rekordbox 6', note: 'Stay on the drive' });
      }
    }
    var copy = all.filter(function (r) { return r.a === 'copy'; });
    var copyMB = copy.reduce(function (s, r) { return s + r.mb; }, 0);
    var nUpdate = all.filter(function (r) { return r.a === 'update'; }).length;
    var missing = all.filter(function (r) { return r.a === 'skip'; });
    var nSkip = missing.length;
    var nRem = plan.removals.length;
    var chip = function (f, meta) {
      var on = st.filter === f;
      return { on: on ? 'true' : 'false', pick: function () { self.setState({ filter: f }); }, meta: meta,
        bg: on ? '#1e40af33' : 'transparent', ring: on ? 'inset 0 0 0 1px #1d4ed8' : 'none' };
    };
    var destructive = { remove: 1, keep: 1, more: 1, replace: 1, media: 1 };
    var matches = function (r) {
      if (st.filter === 'all') return true;
      if (st.filter === 'cues') return !!r.many;
      if (st.filter === 'remove') return !!destructive[r.a];
      if (st.filter === 'media') return r.a === 'media' || r.id === 'rbmore';
      return r.a === st.filter;
    };
    var words = { copy: 'Copy', update: 'Update', skip: st.missingAck ? 'Leave out' : 'Missing', remove: 'Remove', keep: 'Keep', more: '', replace: 'Replace', media: 'Delete' };
    var rows = all.filter(matches).map(function (r) {
      var id = r.id, del = r.a === 'remove' || r.a === 'replace' || r.a === 'media';
      return {
        isCopy: r.a === 'copy', isUpdate: r.a === 'update', isSkip: r.a === 'skip', isRemove: del, isKeep: r.a === 'keep',
        word: words[r.a], wordColor: del ? '#f87171' : (r.a === 'keep' ? '#a3a3a3' : '#fafafa'),
        title: r.t, artistText: r.ar ? '— ' + r.ar : '', titleColor: r.a === 'more' ? '#a3a3a3' : '#fafafa', playlist: r.p,
        size: r.mb && (r.a === 'copy' || del) ? r.mb + ' MB' : '—',
        note: r.flac ? (conv ? 'FLAC — converted to AIFF for ' + conv : 'FLAC — copied as is') : r.note,
        noteColor: r.a === 'skip' ? '#fafafa' : '#a3a3a3',
        locatable: r.a === 'skip',
        locate: function () { self.setState({ relinked: self.state.relinked.concat([id]) }); }
      };
    });
    var remNames = plan.removals.map(function (r) { return r.name; });
    var remList = remNames.length > 1 ? remNames.slice(0, -1).join(', ') + ' and ' + remNames[remNames.length - 1] : remNames[0];
    var mediaGB = plan.media ? 21.8 : 0;
    var free = 36.1 - copyMB / 1000 + plan.freedGB + mediaGB;
    var showBtn = function (f) {
      return { hasShow: true, showOn: st.filter === f ? 'true' : 'false', showLabel: st.filter === f ? 'Show all' : 'Show tracks',
        show: function () { self.setState({ filter: self.state.filter === f ? 'all' : f }); } };
    };
    var dec = [];
    if (nSkip) dec.push(Object.assign({ id: 'missing', warn: !st.missingAck, resolved: st.missingAck, danger: false, color: st.missingAck ? '#4ade80' : '#facc15',
      title: nSkip + (nSkip === 1 ? ' track’s file can’t be found.' : ' tracks’ files can’t be found.'),
      body: 'Locate them in the table, or export without them. The drive has no copy of them, and an older copy won’t be reused in their place.',
      hasCheck: true, checked: st.missingAck, label: 'Export without ' + (nSkip === 1 ? 'this track' : 'these ' + nSkip + ' tracks') + ' · they stay in your playlists',
      toggle: function (e) { self.setState({ missingAck: e.target.checked }); } }, showBtn('skip')));
    dec.push(Object.assign({ id: 'cues', warn: !st.cueAck, resolved: st.cueAck, danger: false, color: st.cueAck ? '#4ade80' : '#facc15', hasCues: true,
      title: '3 tracks have more than 10 memory cues.',
      body: 'The players set up for KINGSTON show up to 10. You chose which 10 on 2 tracks. Concrete Choir has no choice yet; its other cues stay in Recrate either way.',
      hasCheck: true, checked: st.cueAck, label: 'Use Concrete Choir’s first 10 by position (bars 1–129) · 4 later cues aren’t exported',
      toggle: function (e) { self.setState({ cueAck: e.target.checked }); } }, showBtn('cues')));
    if (nRem) dec.push(Object.assign({ id: 'remove', danger: true, warn: false, resolved: false, color: '#f87171',
      title: remList + (nRem === 1 ? ' will be removed from KINGSTON.' : ' will be removed from KINGSTON.'),
      body: plan.delTracks + ' tracks that no remaining playlist uses will be deleted from the drive (' + plan.freedGB.toFixed(1) + ' GB). Tracks still in another playlist stay. Your library isn’t changed' + (plan.replace ? '.' : ', and rekordbox’s playlists on the drive aren’t touched.'),
      hasCheck: true, checked: st.removeOk, label: 'Remove ' + remList + ' from the drive',
      toggle: function (e) { self.setState({ removeOk: e.target.checked }); } }, showBtn('remove')));
    if (plan.replace) dec.push(Object.assign({ id: 'replace', danger: true, warn: false, resolved: false, color: '#f87171',
      title: 'Replace rekordbox’s library on KINGSTON.',
      body: 'Removes its 3 playlists and 137 track entries, with their cues, loops, beat grids and My Tags, and its 137 analysis files. Both library files are backed up to this computer first. ' +
        (plan.media ? 'Its audio files are handled separately below.' : 'Its 137 audio files (21.8 GB) stay on the drive. Recrate can’t tell whether your computer has copies of them.'),
      hasCheck: true, checked: st.replaceOk, label: 'Replace rekordbox’s library',
      toggle: function (e) { self.setState({ replaceOk: e.target.checked }); } }, showBtn('remove')));
    if (plan.media) dec.push(Object.assign({ id: 'media', danger: true, warn: false, resolved: false, color: '#f87171',
      title: 'Delete rekordbox’s 137 audio files from KINGSTON.',
      body: 'Each file is copied to ~/Music/Recrate/Device backups/KINGSTON first and checked, then deleted from the drive. This needs 21.8 GB free on this computer. The library backup alone can’t bring deleted audio back.',
      hasCheck: true, checked: st.mediaOk, label: 'Delete these 137 audio files after they’re copied to this computer',
      toggle: function (e) { self.setState({ mediaOk: e.target.checked }); } }, showBtn('media')));
    dec.forEach(function (d) { d.textId = 'xr-' + d.id; if (!d.hasShow) d.hasShow = false; if (!d.hasCues) d.hasCues = false; });
    // Every open decision blocks Export.
    var open = [];
    if (nSkip && !st.missingAck) open.push('the ' + nSkip + ' missing files');
    if (!st.cueAck) open.push('Concrete Choir’s memory cues');
    if (nRem && !st.removeOk) open.push('removing ' + remList);
    if (plan.replace && !st.replaceOk) open.push('replacing rekordbox’s library');
    if (plan.media && !st.mediaOk) open.push('deleting rekordbox’s audio');
    var hint = st.started ? 'Starting export…'
      : open.length ? 'Decide on ' + open.join(', ') + ' to export'
      : copy.length + ' copies · ' + nUpdate + ' updates' + (nRem ? ' · ' + nRem + (nRem === 1 ? ' removal' : ' removals') : '') + (plan.replace ? ' · replace' : '') + (nSkip ? ' · ' + nSkip + ' left out' : '');
    var disabled = open.length > 0 || st.started;
    var draft = function () {
      return { key: plan.key, relinked: self.state.relinked, missingAck: self.state.missingAck, cueAck: self.state.cueAck,
        removeOk: self.state.removeOk, replaceOk: self.state.replaceOk, mediaOk: self.state.mediaOk };
    };
    var labels = { all: 'All changes', copy: 'Tracks to copy', update: 'Tracks to update', skip: 'Missing tracks', remove: 'Removals', media: 'rekordbox audio to delete', cues: 'Tracks with more than 10 memory cues' };
    return {
      formatsLabel: plan.formatsLabel,
      chips: {
        all: chip('all', (4 - nRem) + ' playlists'),
        copy: chip('copy', copy.length + ' tracks · ' + this.gb(copyMB)),
        update: chip('update', nUpdate + ' tracks (cues and beat grids)'),
        skip: chip('skip', nSkip ? nSkip + ' files not found' : 'Nothing'),
        remove: chip('remove', nRem || plan.replace ? [nRem ? nRem + (nRem === 1 ? ' playlist' : ' playlists') : '', plan.replace ? 'rekordbox library' : ''].filter(Boolean).join(' · ') : 'Nothing')
      },
      tableLabel: labels[st.filter],
      rows: rows,
      isEmpty: rows.length === 0,
      emptyText: st.filter === 'skip' ? 'Every track’s file was found' : 'Nothing to show',
      decisions: dec,
      spaceColor: free < 0 ? '#f87171' : '#4ade80',
      spaceText: free.toFixed(1) + ' GB free after export.',
      spaceMeta: 'KINGSTON has 36.1 GB free now.' + (plan.media ? ' This computer needs 21.8 GB for the audio backup.' : ''),
      hint: hint,
      exportDisabled: disabled,
      exportBg: disabled ? '#262626' : '#fafafa',
      exportFg: disabled ? '#a3a3a3' : '#171717',
      exportNow: function () {
        var result = {
          omitted: missing.map(function (r) { return { t: r.t, ar: r.ar, p: r.p }; }),
          relinked: self.base.filter(function (r) { return r.a === 'skip' && linked(r); }).map(function (r) { return { t: r.t, ar: r.ar, p: r.p }; }),
          cueChoice: 'first10'
        };
        if (self.props.onExport) self.props.onExport(result);
        else self.setState({ started: true });
      },
      back: function () {
        if (self.props.onBack) self.props.onBack(draft());
        else self.setState({ filter: 'all' });
      },
      close: function () {
        if (self.props.onClose) self.props.onClose(draft());
        else self.setState({ filter: 'all' });
      }
    };
  }
}
</script>
